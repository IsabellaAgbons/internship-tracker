name: Weekly Internship Digest
on:
  schedule:
    # cron: minute hour day-of-month month day-of-week — 0 9 * * 1 is every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:
jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run digest
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python main.py
      - name: Commit postings database
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: postings.db
          commit_message: "Update postings.db with latest data"